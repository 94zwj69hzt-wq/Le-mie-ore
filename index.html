<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a04bb5"><meta name="apple-mobile-web-app-capable" content="yes"><title>Le Mie Ore</title><style>*{box-sizing:border-box}body{margin:0;background:#fdf6fc;color:#58245f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;margin:auto;padding:24px 14px 50px}h1{margin:0;color:#922c9b;font-size:29px}small{color:#966e9a}.comic-banner{margin-top:14px}.comic-banner svg{width:100%;height:auto;display:block}.panel{background:white;border-radius:20px;padding:16px;box-shadow:0 4px 20px #6c266015;margin-top:18px}.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.nav strong{font-size:20px}.nav button{background:#f6e2f6;color:#812e89;border:0;border-radius:12px;padding:10px 15px;font-size:19px}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dow{text-align:center;font-size:12px;font-weight:700;padding:7px 0}.day{border:0;border-radius:9px;min-height:54px;background:#f7eef7;color:#67366a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:3px 0;font-size:13px}.day b{font-size:12px}.day.selected{outline:3px solid #54205d;outline-offset:1px}.day[data-level="1"]{background:#f6badb}.day[data-level="2"]{background:#d9b1f3}.day[data-level="3"]{background:#ed65b5;color:#fff}.day[data-level="4"]{background:#9144bd;color:#fff}.day[data-level="5"]{background:#d83d54;color:#fff}.editor{margin-top:18px;background:#fdf0fa;padding:14px;border-radius:14px}.editor h3{margin:0 0 12px}.fields{display:flex;gap:10px}.fields label{flex:1;font-size:13px}.fields input{width:100%;margin-top:5px;padding:12px;border:1px solid #dcb6db;border-radius:10px;font-size:18px;background:white;color:#54205d}.actions{display:flex;gap:8px;margin-top:12px}button.primary{background:#9638ad;color:white;border:0;border-radius:12px;padding:12px;flex:1;font-weight:700}button.delete{background:white;color:#ba2450;border:1px solid #edbbce;border-radius:12px;padding:12px}.summary{display:flex;justify-content:space-between;padding:13px 2px;border-bottom:1px solid #f1e3f1}.summary:last-child{border:0}.summary b{color:#8a2d98}.legend{display:flex;gap:5px;justify-content:space-between;margin-top:16px}.legend span{font-size:11px;text-align:center;flex:1}.swatch{height:12px;border-radius:5px;margin-bottom:4px}.foot{margin-top:20px;text-align:center}a{color:#8c339b;font-size:13px}#notice{font-size:12px;color:#a12449;margin-top:10px}</style></head><body><main class="app"><h1>Le Mie Ore ♡</h1><small>Il mio calendario degli straordinari</small><div class="comic-banner" aria-label="Sveglia rosa che fa l'occhiolino e mostra il pollice in su"><svg viewBox="0 0 660 165" role="img" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#f8c4e6"/><stop offset="1" stop-color="#d9b5fb"/></linearGradient><linearGradient id="clock" x2="0" y2="1"><stop stop-color="#ff83c0"/><stop offset="1" stop-color="#b953be"/></linearGradient></defs><rect x="4" y="10" width="652" height="145" rx="36" fill="url(#wash)" opacity=".72"/><g stroke="#54235e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M57 49 43 36M42 86H25M76 26 71 12M228 36l12-16M244 72l19-4" fill="none"/><path d="M97 37 82 15q-18-9-25 12l7 27M165 33l17-23q18-8 26 11l-7 33" fill="url(#clock)"/><circle cx="134" cy="90" r="65" fill="url(#clock)"/><circle cx="134" cy="90" r="51" fill="#fff8ed"/><path d="M103 88q10-13 20 0" fill="none"/><ellipse cx="153" cy="85" rx="5" ry="8" fill="#54235e"/><path d="M124 112q12 15 26 0" fill="none"/><circle cx="100" cy="103" r="8" fill="#f6b1bc" stroke="none"/><circle cx="169" cy="103" r="8" fill="#f6b1bc" stroke="none"/><path d="M186 112q27 2 35-18l5-21q2-8 10-7 8 1 6 11l-3 15 14-3q11-1 13 9l-4 25q-3 14-19 15l-34-2-24-8" fill="#ffcb99"/><path d="M84 130q-10 17-23 11" fill="none"/><path d="M83 147h112" stroke="#54235e"/></g><text x="291" y="78" font-family="cursive,system-ui" font-size="52" font-style="italic" font-weight="800" fill="#58225d">Le Mie Ore</text><path d="M302 93q135 28 278-2" fill="none" stroke="#e54b99" stroke-width="8" stroke-linecap="round"/><g transform="translate(522 104) rotate(-7)"><rect width="92" height="48" rx="8" fill="#fff8f0" stroke="#6c337d" stroke-width="4"/><path d="m13 16 7 6 12-14M13 35l7 5 12-14" stroke="#e64573" stroke-width="4" fill="none"/><path d="M40 16h39M40 35h39" stroke="#a478b6" stroke-width="3"/></g><path d="m267 41 7-12 7 12 13 4-13 5-7 12-7-12-13-5Z" fill="#f4ad32"/></svg></div><section class="panel"><div class="nav"><button id="prev" aria-label="Mese precedente">‹</button><strong id="month"></strong><button id="next" aria-label="Mese successivo">›</button></div><div class="grid" id="calendar"></div><div class="legend" id="legend"></div><div class="editor" id="editor" hidden><h3 id="selectedDate"></h3><div class="fields"><label>Ore<input id="hours" type="number" inputmode="numeric" min="0" max="5" step="1"></label><label>Minuti<input id="minutes" type="number" inputmode="numeric" min="0" max="59" step="1"></label></div><div class="actions"><button class="primary" id="save">Salva</button><button class="delete" id="remove">Cancella</button></div><div id="notice"></div></div></section><section class="panel"><div class="summary"><span>Totale settimanale</span><b id="week">0h 00m</b></div><div class="summary"><span>Totale mensile</span><b id="monthTotal">0h 00m</b></div><div class="summary"><span>Totale annuale</span><b id="yearTotal">0h 00m</b></div></section><div class="foot"><a href="#" id="export">Esporta una copia dei dati</a></div></main><script>(()=>{'use strict';const KEY='le-mie-ore-records-v1';let records={};try{const value=JSON.parse(localStorage.getItem(KEY)||'{}');if(value&&typeof value==='object'&&!Array.isArray(value))records=value}catch(e){}const now=new Date();let year=now.getFullYear(),month=now.getMonth(),selected=null;const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),key=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d),fmt=m=>Math.floor(m/60)+'h '+pad(m%60)+'m',level=m=>m>=300?5:m>=240?4:m>=180?3:m>=120?2:m>0?1:0;const colors=['#f6badb','#d9b1f3','#ed65b5','#9144bd','#d83d54'];$('legend').innerHTML=colors.map((c,i)=>'<span><div class="swatch" style="background:'+c+'"></div>'+(i+1)+'h</span>').join('');function saveData(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){$('notice').textContent='Salvataggio non riuscito: esporta i dati e controlla lo spazio disponibile.';return false}}function totals(){const monday=new Date(now.getFullYear(),now.getMonth(),now.getDate());monday.setDate(monday.getDate()-(monday.getDay()+6)%7);const end=new Date(monday);end.setDate(end.getDate()+7);let w=0,m=0,y=0;for(const [k,v] of Object.entries(records)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Number.isInteger(v)||v<0)continue;const d=new Date(k+'T12:00:00');if(d>=monday&&d<end)w+=v;if(d.getFullYear()===year&&d.getMonth()===month)m+=v;if(d.getFullYear()===year)y+=v}$('week').textContent=fmt(w);$('monthTotal').textContent=fmt(m);$('yearTotal').textContent=fmt(y)}function render(){const cal=$('calendar');cal.replaceChildren();$('month').textContent=new Intl.DateTimeFormat('it-IT',{month:'long',year:'numeric'}).format(new Date(year,month,1));for(const n of ['L','M','M','G','V','S','D']){const e=document.createElement('div');e.className='dow';e.textContent=n;cal.appendChild(e)}const offset=(new Date(year,month,1).getDay()+6)%7;for(let i=0;i<offset;i++)cal.appendChild(document.createElement('div'));const days=new Date(year,month+1,0).getDate();for(let d=1;d<=days;d++){const k=key(year,month,d),v=records[k]||0,b=document.createElement('button');b.className='day'+(selected===k?' selected':'');b.dataset.level=level(v);b.innerHTML='<span>'+d+'</span>'+(v?'<b>'+(v%60===0?String(v/60):fmt(v))+'</b>':'');b.addEventListener('click',()=>{selected=k;$('editor').hidden=false;$('selectedDate').textContent=new Intl.DateTimeFormat('it-IT',{dateStyle:'long'}).format(new Date(year,month,d));$('hours').value=Math.floor(v/60);$('minutes').value=v%60;$('notice').textContent='';render()});cal.appendChild(b)}totals()}function move(n){const d=new Date(year,month+n,1);year=d.getFullYear();month=d.getMonth();selected=null;$('editor').hidden=true;render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('save').onclick=()=>{if(!selected)return;const h=Number($('hours').value),m=Number($('minutes').value);if(!Number.isInteger(h)||!Number.isInteger(m)||h<0||h>5||m<0||m>59||h*60+m>300){$('notice').textContent='Inserisci ore e minuti validi (massimo 5 ore).';return}const old=records[selected];if(h*60+m)records[selected]=h*60+m;else delete records[selected];if(!saveData()){if(old===undefined)delete records[selected];else records[selected]=old;return}$('editor').hidden=true;selected=null;render()};$('remove').onclick=()=>{if(!selected)return;const old=records[selected];delete records[selected];if(!saveData()){if(old!==undefined)records[selected]=old;return}$('editor').hidden=true;selected=null;render()};$('export').onclick=e=>{e.preventDefault();const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='le-mie-ore-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render()})();</script></body></html>
